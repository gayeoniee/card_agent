# 카드 12장의 **얼굴 구멍**. 카드 크기에 대한 퍼센트 (ImmersiveScene 과 같은 단위).
#
# windows.toml 과 다른 표다. 헷갈리기 쉬운 자리라 갈라 둔 이유를 적어 둔다.
#
#     windows.toml   직사각 그림창.  강아지 **전체**를 contain 으로 넣는다
#                    원화는 *-card-frame.webp (그림 영역이 통째로 비어 있다)
#     holes.toml     타원 얼굴 구멍.  강아지 **얼굴만** 넣는다
#                    원화는 *-card-slots.webp (채소는 인쇄돼 있고 얼굴 자리만 비었다)
#
# 새로 받은 카드 12장이 뒤쪽이다. 채소를 우리가 그리지 않고 저쪽 원화를 그대로 쓰되
# 자리만 비운다 — 앱 PR #19 가 코틀린으로 채소를 그려 보고 "종이 오린 꼴" 이라며
# 되돌린 뒤 정한 방식이다.
#
# **사람이 자를 댄 값이 아니라 tools/measure_holes.py 가 잰 값이다.** 받은 카드는
# 이미 뚫려 있어서 구멍이 곧 좌표다 — 큰 얼굴창은 검게, 아바타 원은 희게 비어 있고,
# 그 자리의 최대 내접원을 그대로 읽었다. 카드가 바뀌면 다시 돌리면 된다.
#
# 잰 값이 맞는지는 확인됐다. 앱이 실기기에서 쓰던 두 값과 이렇게 맞는다.
#
#     배추    51.57 45.14 19.23 14.42   앱 CardSlots.kt  52.84 44.71 19.81 14.27
#     고구마  48.89 41.11 11.89  8.92   앱 CardSlots.kt  48.84 40.76 12.13  8.80
#
# id      : templates/crops.toml 의 card.id 와 같아야 한다 (앱이 어휘의 출처다)
# size    : 잰 원본의 픽셀 크기. 다른 해상도 판을 쓰면 여기부터 다시 재야 한다
# face    : 큰 얼굴창.  cx,cy 는 중심 · rx,ry 는 반지름 (%)
# avatar  : 왼쪽 위 작은 원. 같은 얼굴이 한 번 더 들어간다
#
# ⚠ 글자 자리는 여기 없다. 프레임 배치가 12장 공통이 아니다 — 피망·당근·가지·단호박은
#   검은 프레임에 제목이 가운데 오고 번호판이 아래에 따로 있다. 공통 상수 하나로 두면
#   그 넷에서 엉뚱한 자리에 글자가 찍힌다.

