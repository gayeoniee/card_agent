# 카드 12장의 그림창 좌표. 카드 크기에 대한 퍼센트 (ImmersiveScene 과 같은 단위).
#
# 방향을 뒤집은 자리다. 그림을 놓고 fit 을 재는 대신, 카드별 그림창을 상수로 못박고
# 누끼 bbox 를 그 창에 contain 으로 맞춘다. 그러면 fit 은 코드가 뱉는 값이 되고,
# 사람이 자를 대는 일은 여기 한 번으로 끝난다 (카드당 4개, 12장이면 48개 숫자).
#
# ⚠ 확인된 값은 배추(No.01) 하나뿐이다. 앱의 이머시브가 쓰는 값에서 왔다.
#   나머지 11장은 같은 프레임 배치를 가정한 자리값이라, 카드 원화를 놓고 한 번씩
#   재서 고쳐야 한다. 재는 법은 README 와 tools/contact_sheet.py 참고.
#
# id : templates/crops.toml 의 card.id 와 같아야 한다
# x,y,w,h : 그림창의 왼쪽·위·너비·높이 (%)
# frame : 카드 원화 파일 이름. 없으면 "{id}-card-frame.webp" 로 본다.
#         원화는 git 밖(templates/cards/)에 둔다.

