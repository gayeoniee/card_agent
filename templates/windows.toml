# 카드 12장의 그림창. 카드 크기에 대한 퍼센트.
#
# 사각형이 두 개다 (src/compose.py 의 표 참고).
#
#   art    : 프레임에 뚫린 **구멍**. 사진이 여기 들어간다.
#            tools/art_window.py 가 프레임 알파에서 뽑아 준다 — 자를 대지 않는다.
#   window : 앱의 **창 벌어지는 연출** 좌표 (immersive.mjs 의 setWindow).
#            우리가 정하는 값이 아니라 앱이 정한 상수라 그대로 넘긴다.
#
# 계획에는 "카드당 좌표 4개, 12장이면 48개 숫자를 사람이 한 번 잰다" 고 적었는데,
# 원화가 그림 영역만 투명하게 지운 완성 카드라 **잴 필요가 없었다.** 배추 프레임에서
# 뽑은 값이 앱이 손으로 잰 window 와 0.3%p 안에서 맞는다 (5.03/10.36/90.40/81.25 vs
# 4.91/10.28/90.51/81.58).
#
# measured : 진짜 프레임에서 뽑은 값인가. false 면 아직 자리값이다.
#
# ⚠ 그림창이 뚫린 프레임은 지금 **배추 한 장뿐이다.** 나머지 11장은 도감의 art/*.webp
#   가 그림·프레임·인쇄문구가 한 장에 다 구워진 통짜라 사진을 얹을 구멍이 없다.
#   프레임이 생기면 tools/art_window.py 를 돌려 이 파일의 줄을 갈아끼우면 된다.

[cabbage]                                   # No.01 — 유일하게 진짜 프레임이 있다
frame = "cabbage-card-frame.webp"           # 875x1216
art    = { x = 5.03, y = 10.36, w = 90.4, h = 81.25 }    # 알파에서 뽑음
window = { x = 4.91, y = 10.28, w = 90.51, h = 81.58 }   # cards.mjs 의 scene.window
# 앱의 배추 배치를 맞춘 값. 구멍에 꽉 채워 정중앙에 놓으면 개가 3.4% 크고 5%p 아래에
# 앉는다 — 앱은 여백을 두고 조금 위에 놓는다 (immersive.css 의 transform-origin … 46%).
inset = 3.3
anchor_y = 0.4325
measured = true

[pepper]                                   # No.02 — 프레임 없음 (자리값)
art    = { x = 5.03, y = 10.36, w = 90.4, h = 81.25 }
window = { x = 5.03, y = 10.36, w = 90.4, h = 81.25 }
measured = false

