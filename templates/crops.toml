# 카드 12장. **뽑기용 표**지 모델이 아니다.
#
# 부를 때마다 이 12장 중 하나를 균등하게 뽑는다 (CA-017). 고치기 쉬우라고 코드가
# 아니라 데이터로 뺐다 — 값을 바꾸면 src/crops.py 가 그대로 읽는다.
#
# **자리값이 아니다.** no · name · statLabel · stat · foil 은 앱의
# `ui/dex/DexCards.kt` 의 DEX_CARDS 12줄을 그대로 옮긴 것이다 (CA-012). id 도 앱을
# 따라간다 — 카드 원화 파일 이름이 그 id 이고, templates/windows.toml ·
# templates/holes.toml 도 같은 키를 쓴다.
#
# ⚠ **month 칸은 없다.** 예전에는 생일 월이 카드를 정했는데(CA-004) 그걸 뒤집었다.
#   생일은 여전히 scene.json 의 dog.birthday 와 카드 번호판(NEO-0824)에 쓰이지만,
#   **어느 카드가 나올지는 안 정한다.**
#
# no     : 도감 번호 (1~12, 겹치지 않게)
# id     : scene.json 의 card.id · 카드 원화 파일 이름
# name   : 카드에 찍히는 이름
# statLabel / stat / foil : DexCard 와 같은 이름의 값

