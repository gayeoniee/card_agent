# 생일 월 → 작물 카드 12장. 룰 테이블이지 모델이 아니다.
#
# 카드가 정확히 12장이라 월과 1:1 로 떨어진다. 고치기 쉬우라고 코드가 아니라
# 데이터로 뺐다 — 값을 바꾸면 src/crops.py 가 그대로 읽는다.
#
# no·id·name·statLabel·stat·foil 은 지어낸 값이 아니라 도감의 실제 카드 데이터다
# (SAJOYO/DAENGS_CARDS 의 cards.mjs). 그림에 인쇄된 문구를 옮겨 적은 값이라
# **여기서 지어내면 그림과 어긋난다.**
#
# foil 은 @kongyo2/cards-css 의 포일 이름이고 그대로 DOM 의 data-effect 가 된다.
# No.01 만 포일이 아니라 이머시브(우리가 짠 연출)다.
#
# ⚠ No.11 Tomato 는 그림에 스탯 라벨이 안 찍혀 있어 statLabel 이 비어 있다.
#   지어내지 않고 비워 두는 것이 도감의 규칙이라 계약도 빈 문자열을 받는다.
#
# 월 배치는 우리가 정한 것이다 — 한국 제철 순서에 계획이 못박은 세 자리
# (1월 시금치 · 5월 단호박 · 12월 배추)를 맞췄다.
#
# month : 생일 월 (1~12, 12개가 빠짐없이 한 번씩)
# no    : 도감 번호 (원본 PNG 를 만든 순서 그대로다)
# w/h   : 카드 그림의 실제 픽셀. 셋으로 갈린다 — 크롭하지 않은 값이라 그대로 적는다


