# 생일 월 → 작물 카드 12장. 룰 테이블이지 모델이 아니다.
#
# 카드가 정확히 12장이라 월과 1:1 로 떨어진다. 고치기 쉬우라고 코드가 아니라
# 데이터로 뺐다 — 값을 바꾸면 src/crops.py 가 그대로 읽는다.
#
# **자리값이 아니다.** no · name · statLabel · stat · foil 은 앱의
# `ui/dex/DexCards.kt` 의 DEX_CARDS 12줄을 그대로 옮긴 것이다 (CA-004 가 기다리던
# 그 목록). id 도 앱을 따라간다 — 카드 원화 파일 이름이 그 id 다.
#
# ⚠ **월과 카드의 짝은 아직 사람이 정한 것이 아니다.** 자리값 표가 쓰던 월→no 짝을
#   그대로 두고 no 만 실제 카드로 바꿨다. 배추 12월 · 단호박 5월 · 고구마 9월 셋은
#   우연히 그대로고 나머지 아홉은 뜻 없이 정해진 짝이다. 바꾸려면 여기 month 만
#   고치면 된다 — 파이프라인은 건드릴 것이 없다.
#
# month  : 생일 월 (1~12, 12개가 빠짐없이 한 번씩)
# no     : 도감 번호 (1~12, 겹치지 않게)
# id     : scene.json 의 card.id · 카드 원화 파일 이름
# name   : 카드에 찍히는 이름
# statLabel / stat / foil : DexCard 와 같은 이름의 값

