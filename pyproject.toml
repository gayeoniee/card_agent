[project]
name = "card-agent"
version = "0.1.0"
description = "강아지 얼굴 사진·이름·생일로 개인화 카드와 이머시브 장면을 뽑는 파이프라인"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
cutout = [
    "onnxruntime>=1.29.0",
    "rembg>=2.0.67",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
